<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integração</title>

    <style>
        .container{
            width: 400px;
            margin: 40px auto;
            background: rgb(101, 255, 144);
            padding: 20px;
            border-radius: 10px;
        }

        h2{
            text-align: center;
        }

        label{
            display: block;
            margin-top: 10px;
        }

        input, select{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        .radio-grupo{
            margin-top: 5px;
        }

        button{
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: aqua;
            border: none;
            cursor: pointer;
        }

        #resultado{
            margin-top: 20px;
            padding: 10px;
            background-color: rgb(255, 255, 255);
            border-radius: 5px;
        }

        .erro{
            color: red;
        }

        .sucesso{
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ME DÁ O MORANGO DO AMOR</h2>

        <form id="formulario">

            <label>Nome: </label>
            <input type="text" id="nome"/>

            <label>Idade: </label>
            <input type="number" id="idade"/>

            <label>Tipo de atendimento:</label>
            <select id="tipo">
                <option value="">Selecione</option>
                <option value="tecnico">Técnico</option>
                <option value="administrativo">Administrativo</option>
                <option value="suporte">Suporte</option>
            </select> <br>

            <label>Prioridade</label>
            <div class="radio-grupo">
                <input type="radio" name="prioridade" value="Baixa"> Baixa
                <input type="radio" name="prioridade" value="Media"> Média
                <input type="radio" name="prioridade" value="Alta"> Alta
            </div>

            <button type="submit">Enviar</button>

        </form>

        <div id="resultado"></div>

    </div>

    <script>
        document.getElementById("formulario").addEventListener("submit", function(event){
            (event.preventDefault);

            let nome = document.getElementById("nome").value;
            let idade = document.getElementById("idade").value;
            let tipo = document.getElementById("tipo").value;

            let prioridadeSelecionada = document.querySelector('input[name="prioridade"]:checked')
            let prioridade = prioridadeSelecionada ? prioridadeSelecionada.value : "";

            let resultado = document.getElementById("resultado")

            if(nome === ""){
                resultado.innerHTML = "<p class='erro'>O nome é obrigatório</p>"
                return;
            }

            if(idade === "" || idade < 0){
                resultado.innerHTML = "<p class='erro'>A idade está inválida</p>"
                return;
            }

            let mensagem = ""
            if(prioridade === "Alta"){
                mensagem += "Atendimento urgente!<br>"
            }

            if(tipo === "tecnico"){
                mensagem += "Encaminhar equipe técnica. <br>"
            }

            if(idade < 18) {
                mensagem += "Necessário responsável!"
            }

            resultado.innerHTML = `
                <p class="sucesso"><strong>Resumo do atendimento:</strong></p>
                Nome: ${nome}<br>
                Idade: ${idade}<br>
                Tipo: ${tipo}<br>
                Prioridade: ${prioridade}<br>
            `;
        });
    </script>
</body>
</html>
